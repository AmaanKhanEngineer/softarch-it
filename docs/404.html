    <style>

      label, .text-gray-700 {

  <body class="dark bg-background text-foreground antialiased selection:bg-primary/30 selection:text-white">
    <div id="root"></div>

    <!-- Email Dispatch & Form Delivery Bridge -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          const url = String(args[0] || '');
          if (url.includes('api.emailjs.com')) {
            try {
              let params = {};
              if (args[1] && args[1].body) {
                try {
                  const parsed = JSON.parse(args[1].body);
                  params = parsed.template_params || {};
                } catch(e) {}
              }

              console.log('[Contact Form] Processing inquiry from:', params.from_name);

              // 1. Send direct to amaankhan.engr@gmail.com via FormSubmit AJAX
              let delivered = false;
              try {
                const fsRes = await originalFetch('https://formsubmit.co/ajax/amaankhan.engr@gmail.com', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                  },
                  body: JSON.stringify({
                    name: params.from_name || 'Inquirer',
                    email: params.from_email || '',
                    phone: params.phone_number || 'Not provided',
                    message: params.message || '',
                    _subject: 'SoftArch IT: New Message from ' + (params.from_name || 'Client'),
                    _replyto: params.from_email || '',
                    _template: 'table'
                  })
                });
                if (fsRes.ok) {
                  delivered = true;
                  console.log('[FormSubmit] Email successfully sent to amaankhan.engr@gmail.com');
                }
              } catch(e) {
                console.warn('[FormSubmit] Fallback error:', e);
              }

              // 2. Also log locally to serve.py /api/contact
              try {
                originalFetch('/api/contact', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    name: params.from_name,
                    email: params.from_email,
                    phone: params.phone_number,
                    message: params.message
                  })
                }).catch(() => {});
              } catch(e) {}

              // 3. Attempt EmailJS API call
              try {
                const ejsRes = await originalFetch(...args);
                if (ejsRes.ok) return ejsRes;
              } catch(e) {}

              // If FormSubmit succeeded, return synthetic OK response so the UI displays success toast
              if (delivered) {
                return new Response('OK', { status: 200, statusText: 'OK' });
              }
            } catch(outerErr) {
              console.error('[Contact Bridge Error]:', outerErr);
            }
          }
          return originalFetch.apply(this, args);
        };
      })();
    </script>

    <!-- Production Bundle -->
    <script type="module" crossorigin src="./assets/index.js"></script>
  </body>
</html>
