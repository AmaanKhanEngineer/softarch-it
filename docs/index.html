<!DOCTYPE html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="./assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftArch IT - Amaan Khan | Portfolio & Services</title>
    <meta name="description" content="Professional portfolio showcasing UI/UX Design, Website & App Development, and Software Testing services. Crafting digital solutions with passion & precision." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="SoftArch IT - Amaan Khan | Portfolio & Services" />
    <meta property="og:description" content="Professional portfolio showcasing UI/UX Design, Website & App Development, and Software Testing services. Crafting digital solutions with passion & precision." />

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" crossorigin href="./assets/index.css" />

    <style>
      /* High-contrast form text & labels */
      label, .text-gray-700 {
        color: #f1f5f9 !important;
        font-weight: 500 !important;
      }
      input, textarea {
        color: #ffffff !important;
        background-color: rgba(255, 255, 255, 0.08) !important;
        border: 1px solid rgba(255, 255, 255, 0.25) !important;
        -webkit-text-fill-color: #ffffff !important;
      }
      input:focus, textarea:focus {
        border-color: #3b82f6 !important;
        background-color: rgba(255, 255, 255, 0.12) !important;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4), 0 0 15px rgba(59, 130, 246, 0.3) !important;
        outline: none !important;
      }
      input::placeholder, textarea::placeholder {
        color: rgba(255, 255, 255, 0.5) !important;
        -webkit-text-fill-color: rgba(255, 255, 255, 0.5) !important;
      }
    </style>
  </head>
  <body class="dark bg-background text-foreground antialiased selection:bg-primary/30 selection:text-white">
    <div id="root"></div>

    <!-- Brand Logo Dynamic Navbar Insertion -->
    <script>
      (function() {
        function attachLogo() {
          const headings = document.querySelectorAll('h1');
          for (let i = 0; i < headings.length; i++) {
            const h = headings[i];
            if (h.textContent.trim().startsWith('SoftArch IT') && !h.parentElement.querySelector('.brand-logo-img')) {
              const img = document.createElement('img');
              img.src = './assets/logo.png';
              img.alt = 'SoftArch IT Logo';
              img.className = 'brand-logo-img';
              img.style.cssText = 'width:38px;height:38px;border-radius:8px;object-fit:cover;display:inline-block;vertical-align:middle;margin-right:10px;box-shadow:0 0 12px rgba(59,130,246,0.6);border:1px solid rgba(59,130,246,0.4);cursor:pointer;';
              h.parentElement.style.display = 'flex';
              h.parentElement.style.alignItems = 'center';
              h.parentElement.insertBefore(img, h);
              return true;
            }
          }
          return false;
        }
        if (!attachLogo()) {
          const timer = setInterval(function() {
            if (attachLogo()) clearInterval(timer);
          }, 80);
          setTimeout(function() { clearInterval(timer); }, 6000);
        }
      })();
    </script>

    <!-- Email Dispatch & Form Delivery Bridge -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
          const url = String(args[0] || '');
          if (url.includes('api.emailjs.com')) {
            try {
              let params = {};
              if (args[1] && args[1].body) {
                try {
                  const parsed = JSON.parse(args[1].body);
                  params = parsed.template_params || {};
                } catch(e) {}
              }

              console.log('[Contact Form] Processing inquiry from:', params.from_name);

              // 1. Send direct to amaankhan.engr@gmail.com via FormSubmit AJAX
              let delivered = false;
              try {
                const fsRes = await originalFetch('https://formsubmit.co/ajax/c9e4df9859695724ed4f6a812119e979', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                  },
                  body: JSON.stringify({
                    name: params.from_name || 'Inquirer',
                    email: params.from_email || '',
                    phone: params.phone_number || 'Not provided',
                    message: params.message || '',
                    _subject: 'SoftArch IT: New Message from ' + (params.from_name || 'Client'),
                    _replyto: params.from_email || '',
                    _template: 'table'
                  })
                });
                if (fsRes.ok) {
                  delivered = true;
                  console.log('[FormSubmit] Email successfully sent to amaankhan.engr@gmail.com');
                }
              } catch(e) {
                console.warn('[FormSubmit] Fallback error:', e);
              }

              // 2. Also log locally to serve.py /api/contact
              try {
                originalFetch('/api/contact', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    name: params.from_name,
                    email: params.from_email,
                    phone: params.phone_number,
                    message: params.message
                  })
                }).catch(() => {});
              } catch(e) {}

              // 3. Attempt EmailJS API call
              try {
                const ejsRes = await originalFetch(...args);
                if (ejsRes.ok) return ejsRes;
              } catch(e) {}

              // If FormSubmit succeeded, return synthetic OK response so the UI displays success toast
              if (delivered) {
                return new Response('OK', { status: 200, statusText: 'OK' });
              }
            } catch(outerErr) {
              console.error('[Contact Bridge Error]:', outerErr);
            }
          }
          return originalFetch.apply(this, args);
        };
      })();
    </script>

    <!-- Production Bundle -->
    <script type="module" crossorigin src="./assets/index.js"></script>
  </body>
</html>
